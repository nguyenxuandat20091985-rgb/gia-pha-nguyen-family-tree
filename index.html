(function(){
  function unlock(){
    document.body.classList.remove('custom-dialog-open','member-gate-active');
    document.querySelectorAll('.custom-dialog-overlay').forEach(function(el){ el.remove(); });
  }
  if (document.body) unlock();
  document.addEventListener('DOMContentLoaded', unlock);
})();
</script>
